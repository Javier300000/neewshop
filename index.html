<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>neewshop | Stock OS</title>
  <style>
    :root {
      --bg-black: #040404;
      --glass-bg: rgba(20, 20, 20, 0.6);
      --glass-elevated: rgba(32, 32, 32, 0.7);
      --glass-modal: rgba(14, 14, 14, 0.88);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-border-hover: rgba(255, 255, 255, 0.28);
      --text-white: #ffffff;
      --text-muted: #8a8a8a;
      --neon-white: #ffffff;
      --neon-yellow: #ffea00;
      --neon-pink: #ff0055;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-black);
      background-image:
        radial-gradient(circle at 15% 15%, rgba(255, 255, 255, 0.05) 0%, transparent 35%),
        radial-gradient(circle at 85% 25%, rgba(255, 234, 0, 0.035) 0%, transparent 35%),
        radial-gradient(circle at 50% 85%, rgba(255, 0, 85, 0.035) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text-white);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* PANTALLA DE ACCESO CON CONTRASEÑA */
    .login-screen {
      position: fixed;
      inset: 0;
      background: rgba(4, 4, 4, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-screen.hidden {
      display: none;
    }

    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }

    .login-logo {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: -0.8px;
      text-transform: lowercase;
      color: var(--text-white);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 6px;
    }

    .login-logo span {
      background: var(--text-white);
      color: var(--bg-black);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .login-subtitle {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 700;
      margin-bottom: 22px;
    }

    .pass-wrapper {
      position: relative;
      margin-bottom: 12px;
    }

    .pass-wrapper input {
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--glass-border);
      color: var(--text-white);
      padding: 12px 50px 12px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      text-align: center;
      letter-spacing: 2px;
      outline: none;
    }

    .pass-wrapper input:focus {
      border-color: var(--neon-white);
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.2);
    }

    .pass-wrapper input.input-error,
    .delete-pass-input.input-error {
      border-color: var(--neon-pink) !important;
      box-shadow: 0 0 14px rgba(255, 0, 85, 0.45) !important;
      animation: shake 0.35s ease;
    }

    .toggle-pass-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px;
    }

    .login-error-msg {
      color: var(--neon-pink);
      font-size: 0.75rem;
      font-weight: 700;
      min-height: 18px;
      margin-bottom: 8px;
    }

    .login-btn {
      width: 100%;
      background: var(--neon-white);
      color: #000000;
      border: none;
      padding: 13px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.3);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
      75% { transform: translateX(-4px); }
    }

    /* CONTENEDOR PRINCIPAL */
    .app-container {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 100px;
      position: relative;
    }

    header {
      padding: 12px 16px;
      position: sticky;
      top: 0;
      background: rgba(6, 6, 6, 0.8);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      z-index: 20;
      border-bottom: 1px solid var(--glass-border);
    }

    .header-inner {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-transform: lowercase;
      color: var(--text-white);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .brand-title span {
      background: var(--text-white);
      color: var(--bg-black);
      padding: 1px 7px;
      border-radius: 6px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .excel-btn {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(10px);
      color: var(--text-white);
      border: 1px solid rgba(255, 255, 255, 0.35);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .excel-btn svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .badge-live {
      font-size: 0.64rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 5px 8px;
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-white);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .sync-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--neon-white);
      box-shadow: 0 0 6px var(--neon-white);
    }

    .lock-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-white);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .lock-btn svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .search-box {
      width: 100%;
    }

    .search-box input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      color: var(--text-white);
      padding: 10px 14px;
      border-radius: 11px;
      font-size: 0.88rem;
      outline: none;
    }

    .search-box input::placeholder {
      color: #666;
    }

    .search-box input:focus {
      border-color: var(--neon-white);
    }

    /* TARJETAS DE ESTADO DE STOCK (KPI) */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 12px 16px 4px;
    }

    .kpi-card {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 10px 10px;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
    }

    .kpi-card.active-filter-white {
      border-color: var(--neon-white);
      background: rgba(255, 255, 255, 0.08);
    }

    .kpi-card.active-filter-yellow {
      border-color: var(--neon-yellow);
      background: rgba(255, 234, 0, 0.08);
    }

    .kpi-card.active-filter-pink {
      border-color: var(--neon-pink);
      background: rgba(255, 0, 85, 0.08);
    }

    .kpi-label {
      font-size: 0.62rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-indicator-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    .dot-white { background: var(--neon-white); box-shadow: 0 0 6px var(--neon-white); }
    .dot-yellow { background: var(--neon-yellow); box-shadow: 0 0 6px var(--neon-yellow); }
    .dot-pink { background: var(--neon-pink); box-shadow: 0 0 6px var(--neon-pink); }

    .kpi-value {
      font-size: 1.25rem;
      font-weight: 900;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .kpi-range {
      font-size: 0.62rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .kpi-value.neon-white { color: var(--neon-white); }
    .kpi-value.neon-yellow { color: var(--neon-yellow); }
    .kpi-value.neon-pink { color: var(--neon-pink); }

    /* FILTROS Y CATEGORÍAS */
    .controls-wrapper {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stock-tabs {
      display: flex;
      gap: 6px;
      padding: 8px 16px 2px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .stock-tabs::-webkit-scrollbar { display: none; }

    .stock-tab {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      color: var(--text-muted);
      border: 1px solid var(--glass-border);
      padding: 7px 11px;
      border-radius: 10px;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      white-space: nowrap;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .stock-tab.active-all {
      background: var(--neon-white);
      color: #000000;
      border-color: var(--neon-white);
    }

    .stock-tab.active-low {
      background: rgba(255, 234, 0, 0.14);
      color: var(--neon-yellow);
      border-color: var(--neon-yellow);
    }

    .stock-tab.active-out {
      background: rgba(255, 0, 85, 0.15);
      color: var(--neon-pink);
      border-color: var(--neon-pink);
    }

    .categories-bar-row {
      display: flex;
      align-items: center;
      padding: 4px 16px;
      gap: 8px;
    }

    .categories-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
    }

    .categories-scroll::-webkit-scrollbar { display: none; }

    .delete-cat-chip {
      background: rgba(255, 0, 85, 0.1);
      color: var(--neon-pink);
      border: 1px solid rgba(255, 0, 85, 0.35);
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }

    .delete-cat-chip:active {
      background: rgba(255, 0, 85, 0.25);
    }

    .cat-chip {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      color: var(--text-white);
      border: 1px solid var(--glass-border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .cat-chip.active {
      background: var(--neon-white);
      color: #000000;
      border-color: var(--neon-white);
      font-weight: 800;
    }

    .section-banner {
      margin: 4px 16px;
      padding: 9px 12px;
      border-radius: 11px;
      font-size: 0.72rem;
      font-weight: 800;
      display: none;
      align-items: center;
      justify-content: space-between;
    }

    .section-banner.show-low {
      display: flex;
      background: rgba(255, 234, 0, 0.1);
      border: 1px solid rgba(255, 234, 0, 0.4);
      color: var(--neon-yellow);
    }

    .section-banner.show-out {
      display: flex;
      background: rgba(255, 0, 85, 0.1);
      border: 1px solid rgba(255, 0, 85, 0.4);
      color: var(--neon-pink);
    }

    /* CUADRÍCULA DE PRODUCTOS */
    .product-list {
      padding: 8px 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .product-card {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .product-info {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      min-width: 0;
    }

    .product-cat {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .product-name {
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--text-white);
      line-height: 1.25;
      word-wrap: break-word;
    }

    .product-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
    }

    .meta-pill {
      background: var(--glass-elevated);
      color: var(--text-white);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .price-pill {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.3);
      color: var(--neon-white);
      font-weight: 800;
    }

    .wholesale-pill {
      background: rgba(255, 234, 0, 0.1);
      border-color: rgba(255, 234, 0, 0.35);
      color: var(--neon-yellow);
      font-weight: 800;
    }

    .color-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      border: 1px solid rgba(255, 255, 255, 0.4);
      flex-shrink: 0;
    }

    /* CONTROLES DE STOCK Y SEMÁFORO */
    .stock-controls {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 7px;
      flex-shrink: 0;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .stock-status {
      font-size: 0.6rem;
      font-weight: 900;
      padding: 3px 7px;
      border-radius: 5px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .status-ok {
      background: rgba(255, 255, 255, 0.1);
      color: var(--neon-white);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .status-low {
      background: rgba(255, 234, 0, 0.12);
      color: var(--neon-yellow);
      border: 1px solid rgba(255, 234, 0, 0.5);
    }

    .status-out {
      background: rgba(255, 0, 85, 0.14);
      color: var(--neon-pink);
      border: 1px solid rgba(255, 0, 85, 0.5);
    }

    .delete-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      width: 25px;
      height: 25px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .delete-btn svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .delete-btn:active {
      background: rgba(255, 0, 85, 0.15);
      color: var(--neon-pink);
    }

    .stepper {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px;
      border-radius: 9px;
      border: 1px solid var(--glass-border);
    }

    .stepper button {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      border: none;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-white);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    .stepper button:active {
      background: var(--neon-white);
      color: #000000;
    }

    .stock-count {
      min-width: 22px;
      text-align: center;
      font-weight: 800;
      font-size: 0.88rem;
    }

    /* DOCK FLOTANTE INFERIOR */
    .bottom-dock {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 480px;
      padding: 6px;
      background: rgba(14, 14, 14, 0.8);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      display: flex;
      gap: 6px;
      z-index: 30;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .fab-btn {
      flex: 1.4;
      background: var(--neon-white);
      color: #000000;
      border: none;
      padding: 12px 14px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 0.4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .fab-cat-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      color: var(--neon-white);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 12px 10px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    /* VENTANAS MODALES */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 50;
    }

    .modal-overlay.open { display: flex; }

    .modal-sheet {
      width: 100%;
      max-width: 440px;
      background: var(--glass-modal);
      backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-top: 2px solid var(--neon-white);
      border-radius: 22px 22px 0 0;
      padding: 20px 18px 26px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-sheet.danger-sheet {
      border-top: 2px solid var(--neon-pink);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title { font-size: 1.05rem; font-weight: 800; }

    .close-btn {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-white);
      border: 1px solid var(--glass-border);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2.2; }

    .form-group { margin-bottom: 12px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    label {
      display: block;
      font-size: 0.68rem;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 5px;
      font-weight: 700;
    }

    input, select {
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--glass-border);
      color: var(--text-white);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.88rem;
      outline: none;
    }

    select option { background: #111; color: #fff; }

    .submit-btn {
      width: 100%;
      background: var(--neon-white);
      color: #000000;
      border: none;
      padding: 13px;
      border-radius: 11px;
      font-size: 0.85rem;
      font-weight: 900;
      text-transform: uppercase;
      margin-top: 6px;
      cursor: pointer;
    }

    .size-type-hint {
      font-size: 0.7rem;
      color: var(--neon-yellow);
      margin-top: 5px;
      font-weight: 600;
    }

    .delete-text {
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .delete-text strong { color: var(--text-white); }

    .delete-pass-box { margin-bottom: 6px; }

    .delete-pass-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--glass-border);
      color: var(--text-white);
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      text-align: center;
      letter-spacing: 2px;
      outline: none;
    }

    .delete-error-msg {
      color: var(--neon-pink);
      font-size: 0.74rem;
      font-weight: 700;
      min-height: 18px;
      margin-bottom: 10px;
      text-align: center;
    }

    .confirm-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .cancel-action-btn {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-white);
      border: 1px solid var(--glass-border);
      padding: 11px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
    }

    .confirm-delete-btn {
      background: var(--neon-pink);
      color: var(--text-white);
      border: none;
      padding: 11px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
      font-size: 0.88rem;
      background: var(--glass-bg);
      border: 1px dashed var(--glass-border);
      border-radius: 16px;
    }

    /* ESCRITORIO Y TABLETS */
    @media (min-width: 768px) {
      header { padding: 16px 28px; }
      .header-inner { flex-direction: row; justify-content: space-between; align-items: center; gap: 20px; }
      .brand-row { flex: 1; margin-bottom: 0; }
      .search-box { max-width: 350px; }
      .kpi-grid { padding: 20px 28px 6px; gap: 14px; }
      .kpi-card { padding: 16px 18px; }
      .kpi-value { font-size: 1.6rem; }
      .controls-wrapper { padding: 4px 28px 0; flex-direction: row; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
      .stock-tabs, .categories-bar-row { padding: 4px 0; }
      .section-banner { margin: 8px 28px 4px; }
      .product-list { padding: 12px 28px; grid-template-columns: repeat(2, 1fr); gap: 14px; }
      .modal-overlay { align-items: center; padding: 20px; }
      .modal-sheet { border-radius: 24px; border: 1px solid var(--glass-border); border-top: 2px solid var(--neon-white); }
    }

    @media (min-width: 1100px) {
      .product-list { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

  <!-- PANTALLA DE BLOQUEO CON CONTRASEÑA -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="login-logo">neew<span>shop</span></div>
      <div class="login-subtitle">Acceso Personal Autorizado</div>

      <form onsubmit="verificarAcceso(event)">
        <div class="pass-wrapper">
          <input type="password" id="passInput" placeholder="Contraseña" required autocomplete="current-password" />
          <button type="button" class="toggle-pass-btn" onclick="togglePasswordVisibility()" id="eyeBtn">Ver</button>
        </div>
        <div class="login-error-msg" id="loginError"></div>
        <button type="submit" class="login-btn">Desbloquear Stock</button>
      </form>
    </div>
  </div>

  <!-- APLICACIÓN PRINCIPAL -->
  <div class="app-container">
    <header>
      <div class="header-inner">
        <div class="brand-row">
          <div class="brand-title">neew<span>shop</span></div>
          <div class="header-actions">
            <button class="excel-btn" onclick="exportarExcel()" title="Descargar Excel">
              <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="13" x2="16" y2="13"></line><line x1="8" y1="17" x2="16" y2="17"></line></svg>
              Excel
            </button>
            <div class="badge-live"><span class="sync-dot"></span> <span id="syncText">En Vivo</span></div>
            <button class="lock-btn" onclick="bloquearApp()" title="Bloquear sesión">
              <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </button>
          </div>
        </div>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Buscar prenda, tenis, color..." oninput="renderProducts()" />
        </div>
      </div>
    </header>

    <!-- TARJETAS CONTADORAS DE ESTADO -->
    <section class="kpi-grid">
      <div class="kpi-card" id="cardOk" onclick="setStockFilter('EN_STOCK')">
        <div class="kpi-label"><span class="status-indicator-dot dot-white"></span> En Stock</div>
        <div class="kpi-value neon-white"><span id="kpiOk">0</span><span class="kpi-range">16+</span></div>
      </div>
      <div class="kpi-card" id="cardLow" onclick="setStockFilter('BAJO_STOCK')">
        <div class="kpi-label"><span class="status-indicator-dot dot-yellow"></span> Bajo Stock</div>
        <div class="kpi-value neon-yellow"><span id="kpiLow">0</span><span class="kpi-range">1-15</span></div>
      </div>
      <div class="kpi-card" id="cardOut" onclick="setStockFilter('SIN_STOCK')">
        <div class="kpi-label"><span class="status-indicator-dot dot-pink"></span> No hay Stock</div>
        <div class="kpi-value neon-pink"><span id="kpiOut">0</span><span class="kpi-range">0</span></div>
      </div>
    </section>

    <!-- FILTROS Y CATEGORÍAS CON BOTÓN DE ELIMINAR CATEGORÍA -->
    <div class="controls-wrapper">
      <div class="stock-tabs">
        <button class="stock-tab active-all" id="tabAll" onclick="setStockFilter('TODOS')"><span class="status-indicator-dot dot-white"></span> Todo</button>
        <button class="stock-tab" id="tabLow" onclick="setStockFilter('BAJO_STOCK')"><span class="status-indicator-dot dot-yellow"></span> Bajo Stock (1-15)</button>
        <button class="stock-tab" id="tabOut" onclick="setStockFilter('SIN_STOCK')"><span class="status-indicator-dot dot-pink"></span> Sin Stock (0)</button>
      </div>

      <div class="categories-bar-row">
        <nav class="categories-scroll" id="categoriesBar"></nav>
        <button class="delete-cat-chip" onclick="toggleDeleteCategoryModal(true)">Eliminar Categoría</button>
      </div>
    </div>

    <!-- BANNER DE SECCIÓN -->
    <div class="section-banner" id="sectionBanner">
      <span id="bannerText">SECCIÓN BAJO STOCK</span>
      <span style="cursor:pointer; text-decoration:underline;" onclick="setStockFilter('TODOS')">Ver todo</span>
    </div>

    <main class="product-list" id="productList"></main>
  </div>

  <!-- DOCK FLOTANTE INFERIOR -->
  <div class="bottom-dock">
    <button class="fab-btn" onclick="toggleModal(true)">+ PRODUCTO</button>
    <button class="fab-cat-btn" onclick="toggleCategoryModal(true)">+ CATEGORÍA</button>
  </div>

  <!-- MODAL AGREGAR PRODUCTO -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <div class="modal-title">Nuevo Producto con 4 Precios</div>
        <button class="close-btn" onclick="toggleModal(false)" aria-label="Cerrar"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
      </div>
      <form id="productForm" onsubmit="addProduct(event)">
        <div class="form-group">
          <label>Nombre del Producto</label>
          <input type="text" id="pName" placeholder="Ej. Hoodie Oversize / Tenis" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Categoría</label>
            <select id="pCat" onchange="actualizarOpcionesTalla()" required></select>
          </div>
          <div class="form-group">
            <label id="sizeLabel">Talla</label>
            <select id="pSize" required></select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Color</label>
            <input type="text" id="pColor" placeholder="Ej. Negro, Blanco..." required />
          </div>
          <div class="form-group">
            <label>Stock Inicial</label>
            <input type="number" id="pStock" placeholder="20" min="0" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Costo (Lo que nos cuesta)</label>
            <input type="number" id="pCost" placeholder="300" min="0" step="0.5" required />
          </div>
          <div class="form-group">
            <label>Precio Menudeo</label>
            <input type="number" id="pPrice" placeholder="550" min="1" step="0.5" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Precio Mayoreo</label>
            <input type="number" id="pWholesale" placeholder="450" min="1" step="0.5" required />
          </div>
          <div class="form-group">
            <label>Precio VIP</label>
            <input type="number" id="pVip" placeholder="400" min="1" step="0.5" required />
          </div>
        </div>

        <button type="submit" class="submit-btn">Guardar en Inventario</button>
      </form>
    </div>
  </div>

  <!-- MODAL AGREGAR CATEGORÍA -->
  <div class="modal-overlay" id="addCategoryModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <div class="modal-title">Nueva Categoría</div>
        <button class="close-btn" onclick="toggleCategoryModal(false)" aria-label="Cerrar"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
      </div>
      <form id="categoryForm" onsubmit="addCategory(event)">
        <div class="form-group">
          <label>Nombre de Categoría</label>
          <input type="text" id="cName" placeholder="Ej. Tenis, Gorras..." oninput="autoDetectarTipoTalla()" required />
        </div>
        <div class="form-group">
          <label>Tipo de Tallas</label>
          <select id="cSizeType" required>
            <option value="ropa">Ropa (XS, S, M, L, XL, XXL)</option>
            <option value="calzado">Tenis / Calzado (22 MX a 30 MX)</option>
            <option value="unitalla">Accesorios / Unitalla</option>
          </select>
          <div class="size-type-hint" id="sizeTypeHint">El selector de tallas se adaptará automáticamente.</div>
        </div>
        <button type="submit" class="submit-btn">Crear Categoría</button>
      </form>
    </div>
  </div>

  <!-- MODAL ELIMINAR CATEGORÍA -->
  <div class="modal-overlay" id="deleteCategoryModal">
    <div class="modal-sheet danger-sheet">
      <div class="modal-header">
        <div class="modal-title">Eliminar Categoría</div>
        <button class="close-btn" onclick="toggleDeleteCategoryModal(false)" aria-label="Cerrar"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
      </div>
      <form onsubmit="confirmDeleteCategory(event)">
        <div class="form-group">
          <label>Selecciona la categoría a borrar</label>
          <select id="delCatSelect" required></select>
        </div>
        <div class="delete-pass-box">
          <label>Contraseña requerida</label>
          <input type="password" id="deleteCatPassInput" class="delete-pass-input" placeholder="Contraseña..." required />
        </div>
        <div class="delete-error-msg" id="deleteCatErrorMsg"></div>
        <div class="confirm-actions">
          <button type="button" class="cancel-action-btn" onclick="toggleDeleteCategoryModal(false)">Cancelar</button>
          <button type="submit" class="confirm-delete-btn">Eliminar Categoría</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL ELIMINAR PRODUCTO -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal-sheet danger-sheet">
      <div class="modal-header">
        <div class="modal-title">Autorizar Eliminación</div>
        <button class="close-btn" onclick="closeDeleteModal()" aria-label="Cerrar"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
      </div>
      <p class="delete-text" id="deleteMessage"></p>
      <form onsubmit="confirmDeleteProduct(event)">
        <div class="delete-pass-box">
          <label>Contraseña requerida</label>
          <input type="password" id="deletePassInput" class="delete-pass-input" placeholder="Contraseña..." required />
        </div>
        <div class="delete-error-msg" id="deleteErrorMsg"></div>
        <div class="confirm-actions">
          <button type="button" class="cancel-action-btn" onclick="closeDeleteModal()">Cancelar</button>
          <button type="submit" class="confirm-delete-btn">Eliminar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>

  <script>
    const FIREBASE_DATABASE_URL = "https://neewshop-stock-default-rtdb.firebaseio.com/";
    const CLAVE_TIENDA = "neew2026";
    const CLAVE_ELIMINAR = "neew2026";

    const SISTEMAS_TALLAS = {
      ropa: ["XS", "S", "M", "L", "XL", "XXL", "Unitalla"],
      calzado: ["22 MX", "22.5 MX", "23 MX", "23.5 MX", "24 MX", "24.5 MX", "25 MX", "25.5 MX", "26 MX", "26.5 MX", "27 MX", "27.5 MX", "28 MX", "28.5 MX", "29 MX", "30 MX"],
      unitalla: ["Unitalla", "Ajustable", "Chico", "Mediano", "Grande"]
    };

    const categoriasIniciales = [
      { name: "Sudaderas", sizeType: "ropa" },
      { name: "Sudaderas con gorro", sizeType: "ropa" },
      { name: "Playeras", sizeType: "ropa" },
      { name: "Shorts", sizeType: "ropa" },
      { name: "Tenis", sizeType: "calzado" },
      { name: "Accesorios", sizeType: "unitalla" }
    ];

    const productosIniciales = [
      { id: 1, name: "Hoodie Oversize Acid Wash", category: "Sudaderas con gorro", size: "L", color: "Negro", cost: 350, price: 680, wholesale: 580, vip: 520, stock: 18 },
      { id: 2, name: "Crewneck Minimal Neew", category: "Sudaderas", size: "M", color: "Blanco", cost: 280, price: 550, wholesale: 470, vip: 420, stock: 8 },
      { id: 3, name: "Playera Heavyweight Boxy", category: "Playeras", size: "M", color: "Gris", cost: 160, price: 320, wholesale: 270, vip: 240, stock: 22 },
      { id: 4, name: "Short Cargo Street", category: "Shorts", size: "L", color: "Negro", cost: 210, price: 420, wholesale: 360, vip: 320, stock: 0 }
    ];

    let products = [];
    let categories = [...categoriasIniciales];
    let activeCategory = "Todos";
    let activeStockFilter = "TODOS";
    let productToDeleteId = null;
    let dbRef = null;
    let firebaseIniciado = false;

    function obtenerColorCSS(textoColor) {
      if (!textoColor) return "#ffffff";
      const t = textoColor.toLowerCase().trim();
      const mapaColores = [
        { k: ["negro", "black", "carbon", "carbón", "oscuro"], hex: "#111111" },
        { k: ["blanco", "white", "hueso", "marfil", "off white"], hex: "#ffffff" },
        { k: ["gris", "gray", "grey", "plata", "plateado", "jaspe"], hex: "#8e8e93" },
        { k: ["beige", "arena", "crema", "camel", "caqui", "khaki", "nude"], hex: "#d8c3a5" },
        { k: ["rojo", "red", "vino", "guinda", "burgundy", "cherry"], hex: "#ff2a4b" },
        { k: ["azul marino", "navy"], hex: "#1b3b6f" },
        { k: ["azul cielo", "celeste", "baby blue", "cian", "turquesa"], hex: "#00f0ff" },
        { k: ["azul", "blue", "rey", "mezclilla", "denim"], hex: "#1e6bff" },
        { k: ["verde militar", "olivo", "olive", "kaki"], hex: "#556b2f" },
        { k: ["verde", "green", "menta", "esmeralda", "lima"], hex: "#00e676" },
        { k: ["rosa", "pink", "fiucsa", "fucsia", "pastel", "magenta"], hex: "#ff4da6" },
        { k: ["morado", "purple", "lila", "violeta", "lavanda"], hex: "#9d4edd" },
        { k: ["amarillo", "yellow", "mostaza", "dorado", "oro"], hex: "#ffea00" },
        { k: ["naranja", "orange", "coral", "terracota"], hex: "#ff7b00" },
        { k: ["cafe", "café", "marron", "marrón", "chocolate", "brown", "tabaco"], hex: "#7f4f24" }
      ];
      if (t.includes("/") || t.includes(" con ") || t.includes("-")) {
        const partes = t.split(/\/| con |-/).map(s => s.trim());
        const c1 = buscarHexSimple(partes[0], mapaColores);
        const c2 = buscarHexSimple(partes[1] || "", mapaColores);
        return `linear-gradient(135deg, ${c1} 50%, ${c2} 50%)`;
      }
      return buscarHexSimple(t, mapaColores);
    }

    function buscarHexSimple(fragmento, mapa) {
      for (const item of mapa) {
        for (const palabra of item.k) {
          if (fragmento.includes(palabra)) return item.hex;
        }
      }
      return "#cccccc";
    }

    function obtenerEstadoStock(cantidad) {
      const s = Number(cantidad) || 0;
      if (s === 0) return { codigo: "SIN_STOCK", texto: "NO HAY STOCK", clase: "status-out" };
      if (s <= 15) return { codigo: "BAJO_STOCK", texto: "BAJO STOCK", clase: "status-low" };
      return { codigo: "EN_STOCK", texto: "EN STOCK", clase: "status-ok" };
    }

    function obtenerTipoTallaDeCategoria(nombreCat) {
      const encontrada = categories.find(c => c.name.toLowerCase() === (nombreCat || "").toLowerCase());
      if (encontrada && encontrada.sizeType) return encontrada.sizeType;
      const n = (nombreCat || "").toLowerCase();
      if (n.includes("tenis") || n.includes("calzado") || n.includes("zapato") || n.includes("sneaker") || n.includes("sandalia") || n.includes("bota")) return "calzado";
      if (n.includes("accesorio") || n.includes("gorra") || n.includes("lente") || n.includes("bolsa") || n.includes("mochila")) return "unitalla";
      return "ropa";
    }

    function actualizarOpcionesTalla() {
      const catSeleccionada = document.getElementById("pCat").value;
      const selectTalla = document.getElementById("pSize");
      const labelTalla = document.getElementById("sizeLabel");
      const tipo = obtenerTipoTallaDeCategoria(catSeleccionada);
      const listaTallas = SISTEMAS_TALLAS[tipo] || SISTEMAS_TALLAS.ropa;

      labelTalla.textContent = tipo === "calzado" ? "Talla (MX)" : (tipo === "unitalla" ? "Medida" : "Talla");
      selectTalla.innerHTML = listaTallas.map(t => {
        const isDefault = (tipo === "ropa" && t === "M") || (tipo === "calzado" && t === "26 MX") || (tipo === "unitalla" && t === "Unitalla");
        return `<option value="${t}" ${isDefault ? "selected" : ""}>${t}</option>`;
      }).join("");
    }

    function autoDetectarTipoTalla() {
      const val = document.getElementById("cName").value.toLowerCase();
      const selectTipo = document.getElementById("cSizeType");
      if (val.includes("tenis") || val.includes("calzado") || val.includes("zapato") || val.includes("sneaker") || val.includes("sandalia")) selectTipo.value = "calzado";
      else if (val.includes("gorra") || val.includes("accesorio") || val.includes("lente")) selectTipo.value = "unitalla";
    }

    function renderCategoriesUI() {
      const bar = document.getElementById("categoriesBar");
      const chipsHTML = [
        `<button class="cat-chip ${activeCategory === 'Todos' ? 'active' : ''}" onclick="setCategory('Todos')">Todos</button>`,
        ...categories.map(c => `<button class="cat-chip ${activeCategory === c.name ? 'active' : ''}" onclick="setCategory('${c.name.replace(/'/g, "\\'")}')">${c.name}</button>`)
      ];
      bar.innerHTML = chipsHTML.join("");

      const selectCat = document.getElementById("pCat");
      const valorActual = selectCat.value;
      selectCat.innerHTML = categories.map(c => `<option value="${c.name}">${c.name}</option>`).join("");
      if (valorActual && categories.some(c => c.name === valorActual)) selectCat.value = valorActual;
      actualizarOpcionesTalla();

      const delSelect = document.getElementById("delCatSelect");
      if (delSelect) {
        delSelect.innerHTML = categories.map(c => `<option value="${c.name}">${c.name}</option>`).join("");
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      renderCategoriesUI();
      if (localStorage.getItem("neewshop_auth_key") === CLAVE_TIENDA) desbloquearApp(CLAVE_TIENDA);
    });

    function togglePasswordVisibility() {
      const input = document.getElementById("passInput");
      const btn = document.getElementById("eyeBtn");
      input.type = input.type === "password" ? "text" : "password";
      btn.textContent = input.type === "password" ? "Ver" : "Ocultar";
    }

    function verificarAcceso(e) {
      e.preventDefault();
      const passInput = document.getElementById("passInput");
      const errorMsg = document.getElementById("loginError");
      if (passInput.value.trim() === CLAVE_TIENDA) {
        localStorage.setItem("neewshop_auth_key", CLAVE_TIENDA);
        errorMsg.textContent = "";
        passInput.value = "";
        desbloquearApp(CLAVE_TIENDA);
      } else {
        errorMsg.textContent = "Contraseña incorrecta.";
        passInput.classList.remove("input-error");
        void passInput.offsetWidth;
        passInput.classList.add("input-error");
      }
    }

    function desbloquearApp(claveActiva) {
      document.getElementById("loginScreen").classList.add("hidden");
      iniciarConexionDatos(claveActiva);
    }

    function bloquearApp() {
      localStorage.removeItem("neewshop_auth_key");
      document.getElementById("loginScreen").classList.remove("hidden");
    }

    function iniciarConexionDatos(claveActiva) {
      if (FIREBASE_DATABASE_URL.startsWith("https://")) {
        if (!firebaseIniciado) {
          firebase.initializeApp({ databaseURL: FIREBASE_DATABASE_URL });
          firebaseIniciado = true;
        }
        dbRef = firebase.database().ref("neewshop_vault/" + claveActiva + "/stock_v3");
        dbRef.on("value", (snapshot) => {
          const data = snapshot.val();
          if (data !== null) {
            if (data.initialized) {
              products = Array.isArray(data.items) ? data.items.filter(Boolean) : Object.values(data.items || {});
              if (data.categories) {
                const rawCats = Array.isArray(data.categories) ? data.categories.filter(Boolean) : Object.values(data.categories);
                if (rawCats.length > 0) categories = rawCats;
              }
            } else {
              products = Array.isArray(data) ? data.filter(Boolean) : Object.values(data);
            }
          } else {
            products = productosIniciales;
            categories = categoriasIniciales;
            saveToDB();
          }
          renderCategoriesUI();
          renderProducts();
        });
      } else {
        document.getElementById("syncText").textContent = "Local";
        products = JSON.parse(localStorage.getItem("neewshop_stock")) || productosIniciales;
        categories = JSON.parse(localStorage.getItem("neewshop_categories")) || categoriasIniciales;
        renderCategoriesUI();
        renderProducts();
      }
    }

    function saveToDB() {
      if (dbRef) {
        dbRef.set({ initialized: true, updatedAt: Date.now(), items: products, categories: categories });
      } else {
        localStorage.setItem("neewshop_stock", JSON.stringify(products));
        localStorage.setItem("neewshop_categories", JSON.stringify(categories));
        renderCategoriesUI();
        renderProducts();
      }
    }

    function setCategory(cat) {
      activeCategory = cat;
      renderCategoriesUI();
      renderProducts();
    }

    function setStockFilter(filtro) {
      activeStockFilter = (activeStockFilter === filtro && filtro !== "TODOS") ? "TODOS" : filtro;
      document.getElementById("tabAll").className = "stock-tab" + (activeStockFilter === "TODOS" ? " active-all" : "");
      document.getElementById("tabLow").className = "stock-tab" + (activeStockFilter === "BAJO_STOCK" ? " active-low" : "");
      document.getElementById("tabOut").className = "stock-tab" + (activeStockFilter === "SIN_STOCK" ? " active-out" : "");

      document.getElementById("cardOk").className = "kpi-card" + (activeStockFilter === "EN_STOCK" ? " active-filter-white" : "");
      document.getElementById("cardLow").className = "kpi-card" + (activeStockFilter === "BAJO_STOCK" ? " active-filter-yellow" : "");
      document.getElementById("cardOut").className = "kpi-card" + (activeStockFilter === "SIN_STOCK" ? " active-filter-pink" : "");

      const banner = document.getElementById("sectionBanner");
      const bannerText = document.getElementById("bannerText");
      banner.className = "section-banner";

      if (activeStockFilter === "BAJO_STOCK") {
        banner.classList.add("show-low");
        bannerText.textContent = "SECCIÓN BAJO STOCK (1 A 15 UNIDADES)";
      } else if (activeStockFilter === "SIN_STOCK") {
        banner.classList.add("show-out");
        bannerText.textContent = "SECCIÓN NO HAY STOCK (0 UNIDADES)";
      }
      renderProducts();
    }

    function updateStock(id, delta) {
      const item = products.find(p => p.id === id);
      if (item) {
        item.stock = Math.max(0, (Number(item.stock) || 0) + delta);
        saveToDB();
      }
    }

    function addProduct(e) {
      e.preventDefault();
      const newProduct = {
        id: Date.now(),
        name: document.getElementById("pName").value.trim(),
        category: document.getElementById("pCat").value,
        size: document.getElementById("pSize").value,
        color: document.getElementById("pColor").value.trim(),
        cost: parseFloat(document.getElementById("pCost").value) || 0,
        price: parseFloat(document.getElementById("pPrice").value) || 0,
        wholesale: parseFloat(document.getElementById("pWholesale").value) || 0,
        vip: parseFloat(document.getElementById("pVip").value) || 0,
        stock: parseInt(document.getElementById("pStock").value, 10) || 0
      };
      products.unshift(newProduct);
      saveToDB();
      document.getElementById("productForm").reset();
      actualizarOpcionesTalla();
      toggleModal(false);
    }

    function addCategory(e) {
      e.preventDefault();
      const nombre = document.getElementById("cName").value.trim();
      const tipoTalla = document.getElementById("cSizeType").value;
      if (!nombre) return;
      if (categories.some(c => c.name.toLowerCase() === nombre.toLowerCase())) {
        alert("Esa categoría ya existe.");
        return;
      }
      categories.push({ name: nombre, sizeType: tipoTalla });
      activeCategory = nombre;
      saveToDB();
      document.getElementById("categoryForm").reset();
      toggleCategoryModal(false);
    }

    function toggleCategoryModal(show) {
      document.getElementById("addCategoryModal").classList.toggle("open", show);
      if (show) setTimeout(() => document.getElementById("cName").focus(), 120);
    }

    function toggleDeleteCategoryModal(show) {
      document.getElementById("deleteCategoryModal").classList.toggle("open", show);
      if (show) {
        renderCategoriesUI();
        document.getElementById("deleteCatPassInput").value = "";
        document.getElementById("deleteCatErrorMsg").textContent = "";
      }
    }

    function confirmDeleteCategory(e) {
      e.preventDefault();
      const catName = document.getElementById("delCatSelect").value;
      const passInput = document.getElementById("deleteCatPassInput");
      const errorMsg = document.getElementById("deleteCatErrorMsg");

      if (passInput.value.trim() !== CLAVE_ELIMINAR) {
        errorMsg.textContent = "Contraseña incorrecta.";
        return;
      }

      // Validar si hay productos usando esta categoría
      const tieneProductos = products.some(p => p.category.toLowerCase() === catName.toLowerCase());
      if (tieneProductos) {
        errorMsg.textContent = "No se puede borrar: hay productos en esta categoría.";
        return;
      }

      categories = categories.filter(c => c.name.toLowerCase() !== catName.toLowerCase());
      if (activeCategory === catName) activeCategory = "Todos";
      saveToDB();
      toggleDeleteCategoryModal(false);
    }

    function askDeleteProduct(id) {
      const item = products.find(p => p.id === id);
      if (!item) return;
      productToDeleteId = id;
      document.getElementById("deleteMessage").innerHTML = `¿Eliminar <strong>${item.name}</strong> (${item.size} • ${item.color})?`;
      const passInput = document.getElementById("deletePassInput");
      passInput.value = "";
      document.getElementById("deleteErrorMsg").textContent = "";
      document.getElementById("deleteModal").classList.add("open");
      setTimeout(() => passInput.focus(), 150);
    }

    function closeDeleteModal() {
      productToDeleteId = null;
      document.getElementById("deletePassInput").value = "";
      document.getElementById("deleteModal").classList.remove("open");
    }

    function confirmDeleteProduct(e) {
      if (e) e.preventDefault();
      if (productToDeleteId === null) return;
      const passInput = document.getElementById("deletePassInput");
      const errorMsg = document.getElementById("deleteErrorMsg");
      if (passInput.value.trim() !== CLAVE_ELIMINAR) {
        errorMsg.textContent = "Contraseña incorrecta.";
        passInput.classList.remove("input-error");
        void passInput.offsetWidth;
        passInput.classList.add("input-error");
        return;
      }
      products = products.filter(p => p.id !== productToDeleteId);
      saveToDB();
      closeDeleteModal();
    }

    function toggleModal(show) {
      if (show) {
        renderCategoriesUI();
        if (activeCategory !== "Todos") {
          document.getElementById("pCat").value = activeCategory;
          actualizarOpcionesTalla();
        }
      }
      document.getElementById("addModal").classList.toggle("open", show);
    }

    function renderProducts() {
      const list = document.getElementById("productList");
      const query = document.getElementById("searchInput").value.toLowerCase();

      document.getElementById("kpiOk").textContent = products.filter(p => (Number(p.stock) || 0) >= 16).length;
      document.getElementById("kpiLow").textContent = products.filter(p => (Number(p.stock) || 0) >= 1 && (Number(p.stock) || 0) <= 15).length;
      document.getElementById("kpiOut").textContent = products.filter(p => (Number(p.stock) || 0) === 0).length;

      const filtered = products.filter(p => {
        const estado = obtenerEstadoStock(p.stock);
        const matchesCat = activeCategory === "Todos" || p.category === activeCategory;
        const matchesStock = activeStockFilter === "TODOS" || estado.codigo === activeStockFilter;
        const matchesSearch = p.name.toLowerCase().includes(query) || p.color.toLowerCase().includes(query) || p.size.toLowerCase().includes(query) || p.category.toLowerCase().includes(query);
        return matchesCat && matchesStock && matchesSearch;
      });

      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty-state">No hay productos en esta sección.</div>`;
        return;
      }

      list.innerHTML = filtered.map(p => {
        const estado = obtenerEstadoStock(p.stock);
        const bgColorDot = obtenerColorCSS(p.color);
        const precioMenudeo = Number(p.price) || 0;
        const precioMayoreo = Number(p.wholesale) || 0;

        return `
          <div class="product-card">
            <div class="product-info">
              <span class="product-cat">${p.category}</span>
              <div class="product-name">${p.name}</div>
              <div class="product-meta">
                <span class="meta-pill">Talla ${p.size}</span>
                <span class="meta-pill"><span class="color-dot" style="background: ${bgColorDot};"></span>${p.color}</span>
                <span class="meta-pill price-pill">Men: $${precioMenudeo.toLocaleString("es-MX")}</span>
                ${precioMayoreo > 0 ? `<span class="meta-pill wholesale-pill">May: $${precioMayoreo.toLocaleString("es-MX")}</span>` : ''}
              </div>
            </div>
            <div class="stock-controls">
              <div class="status-row">
                <span class="stock-status ${estado.clase}">${estado.texto}</span>
                <button class="delete-btn" onclick="askDeleteProduct(${p.id})" title="Eliminar"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
              </div>
              <div class="stepper">
                <button onclick="updateStock(${p.id}, -1)">−</button>
                <span class="stock-count">${p.stock}</span>
                <button onclick="updateStock(${p.id}, 1)">+</button>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    async function exportarExcel() {
      if (!window.ExcelJS) {
        alert("Cargando módulo de Excel, intenta de nuevo.");
        return;
      }
      const workbook = new ExcelJS.Workbook();
      const sheet = workbook.addWorksheet("Inventario neewshop", { views: [{ state: "frozen", ySplit: 8 }] });

      sheet.columns = [
        { key: "num", width: 8 }, { key: "name", width: 30 }, { key: "cat", width: 20 },
        { key: "size", width: 12 }, { key: "color", width: 16 }, { key: "cost", width: 15 },
        { key: "price", width: 15 }, { key: "wholesale", width: 15 }, { key: "vip", width: 15 },
        { key: "stock", width: 12 }, { key: "status", width: 18 }, { key: "profit", width: 18 }, { key: "total", width: 18 }
      ];

      sheet.mergeCells("A1:M2");
      const titleCell = sheet.getCell("A1");
      titleCell.value = "NEEWSHOP — REPORTE DE INVENTARIO Y CONTROL DE PRECIOS";
      titleCell.font = { name: "Calibri", size: 14, bold: true, color: { argb: "FFFFFFFF" } };
      titleCell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF0A0A0A" } };
      titleCell.alignment = { vertical: "middle", horizontal: "center" };

      const startRow = 9;
      const endRow = Math.max(startRow, startRow + products.length - 1);

      sheet.mergeCells("A4:C4");
      sheet.getCell("A4").value = "RESUMEN DE STOCK";
      sheet.getCell("A4").font = { bold: true, size: 9, color: { argb: "FFFFFFFF" } };
      sheet.getCell("A4").fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF1F1F1F" } };

      const resumenFormulas = [
        { l: "A5", v: "B5", t: "EN STOCK", f: `COUNTIF(K${startRow}:K${endRow},"EN STOCK")`, c: "FF111111", tc: "FFFFFFFF" },
        { l: "C5", v: "D5", t: "BAJO STOCK", f: `COUNTIF(K${startRow}:K${endRow},"BAJO STOCK")`, c: "FFFFEA00", tc: "FF000000" },
        { l: "E5", v: "F5", t: "SIN STOCK", f: `COUNTIF(K${startRow}:K${endRow},"NO HAY STOCK")`, c: "FF9B0033", tc: "FFFFFFFF" },
        { l: "G5", v: "H5", t: "TOTAL UNIDADES", f: `SUM(J${startRow}:J${endRow})`, c: "FF262626", tc: "FFFFFFFF" }
      ];

      resumenFormulas.forEach(item => {
        sheet.getCell(item.l).value = item.t;
        sheet.getCell(item.l).font = { bold: true, size: 8, color: { argb: item.tc } };
        sheet.getCell(item.l).fill = { type: "pattern", pattern: "solid", fgColor: { argb: item.c } };
        sheet.getCell(item.l).alignment = { vertical: "middle", horizontal: "center" };

        sheet.getCell(item.v).value = { formula: products.length > 0 ? item.f : "0" };
        sheet.getCell(item.v).font = { bold: true, size: 11, color: { argb: "FF000000" } };
        sheet.getCell(item.v).fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFF2F2F2" } };
        sheet.getCell(item.v).alignment = { vertical: "middle", horizontal: "center" };
      });

      const headerRow = sheet.getRow(8);
      headerRow.values = ["N°", "PRODUCTO", "CATEGORÍA", "TALLA", "COLOR", "COSTO", "MENUDEO", "MAYOREO", "VIP", "STOCK", "ESTADO", "UTILIDAD MENUDEO", "VALOR TOTAL"];
      headerRow.height = 24;
      headerRow.eachCell(cell => {
        cell.font = { bold: true, size: 9, color: { argb: "FFFFFFFF" } };
        cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF0A0A0A" } };
        cell.alignment = { vertical: "middle", horizontal: "center" };
      });

      products.forEach((p, idx) => {
        const rIdx = startRow + idx;
        const row = sheet.getRow(rIdx);
        const stockNum = Number(p.stock) || 0;
        row.values = [
          idx + 1, p.name, p.category, p.size, p.color,
          Number(p.cost) || 0, Number(p.price) || 0, Number(p.wholesale) || 0, Number(p.vip) || 0, stockNum,
          { formula: `IF(J${rIdx}=0,"NO HAY STOCK",IF(J${rIdx}<=15,"BAJO STOCK","EN STOCK"))` },
          { formula: `(G${rIdx}-F${rIdx})*J${rIdx}` },
          { formula: `G${rIdx}*J${rIdx}` }
        ];
        row.height = 20;
        row.eachCell((cell, colNum) => {
          cell.alignment = { vertical: "middle", horizontal: (colNum === 2 || colNum === 3) ? "left" : "center" };
          if (colNum >= 6 && colNum <= 9 || colNum === 12 || colNum === 13) cell.numFmt = '"$"#,##0.00';
          if (colNum === 11) {
            if (stockNum === 0) { cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFFFCCD9" } }; cell.font = { bold: true, color: { argb: "FF9B0033" } }; }
            else if (stockNum <= 15) { cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFFFF3B0" } }; cell.font = { bold: true, color: { argb: "FF7A6200" } }; }
            else { cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFEFEFEF" } }; cell.font = { bold: true, color: { argb: "FF111111" } }; }
          }
        });
      });

      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `Inventario_neewshop_${new Date().toISOString().slice(0, 10)}.xlsx`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
