<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>neewshop | Stock</title>
  <style>
    :root {
      --bg-black: #050505;
      --bg-card: #111111;
      --bg-elevated: #1b1b1b;
      --text-white: #ffffff;
      --text-muted: #888888;
      --neon-white: #ffffff;
      --neon-cyan: #00f0ff;
      --neon-pink: #ff0055;
      --border-dark: #262626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-white);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    /* PANTALLA DE ACCESO CON CONTRASEÑA */
    .login-screen {
      position: fixed;
      inset: 0;
      background-color: var(--bg-black);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      transition: opacity 0.25s ease;
    }

    .login-screen.hidden {
      display: none;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      background: var(--bg-card);
      border: 1px solid var(--border-dark);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.04);
    }

    .login-logo {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -0.8px;
      text-transform: lowercase;
      color: var(--text-white);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }

    .login-logo span {
      background: var(--text-white);
      color: var(--bg-black);
      padding: 2px 10px;
      border-radius: 8px;
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.5);
    }

    .login-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 700;
      margin-bottom: 28px;
    }

    .pass-wrapper {
      position: relative;
      margin-bottom: 14px;
    }

    .pass-wrapper input {
      width: 100%;
      background: var(--bg-black);
      border: 1px solid var(--border-dark);
      color: var(--text-white);
      padding: 14px 44px 14px 16px;
      border-radius: 12px;
      font-size: 1rem;
      text-align: center;
      letter-spacing: 2px;
      outline: none;
      transition: all 0.2s;
    }

    .pass-wrapper input::placeholder {
      letter-spacing: normal;
      color: #555;
      font-size: 0.9rem;
    }

    .pass-wrapper input:focus {
      border-color: var(--neon-white);
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.25);
    }

    .pass-wrapper input.input-error {
      border-color: var(--neon-pink);
      box-shadow: 0 0 16px rgba(255, 0, 85, 0.45);
      animation: shake 0.35s ease;
    }

    .toggle-pass-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 4px;
    }

    .login-error-msg {
      color: var(--neon-pink);
      font-size: 0.78rem;
      font-weight: 700;
      min-height: 20px;
      margin-bottom: 10px;
      text-shadow: 0 0 8px rgba(255, 0, 85, 0.3);
    }

    .login-btn {
      width: 100%;
      background: var(--neon-white);
      color: #000000;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
      transition: transform 0.15s, box-shadow 0.2s;
    }

    .login-btn:active {
      transform: scale(0.97);
      box-shadow: 0 0 28px rgba(255, 255, 255, 0.75);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      50% { transform: translateX(7px); }
      75% { transform: translateX(-5px); }
    }

    /* CONTENEDOR PRINCIPAL DE LA APP */
    .app-container {
      width: 100%;
      max-width: 460px;
      background-color: var(--bg-black);
      min-height: 100vh;
      padding-bottom: 95px;
      position: relative;
      border-left: 1px solid var(--border-dark);
      border-right: 1px solid var(--border-dark);
    }

    header {
      padding: 20px 20px 14px;
      position: sticky;
      top: 0;
      background: rgba(5, 5, 5, 0.9);
      backdrop-filter: blur(12px);
      z-index: 10;
      border-bottom: 1px solid var(--border-dark);
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-transform: lowercase;
      color: var(--text-white);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .brand-title span {
      background: var(--text-white);
      color: var(--bg-black);
      padding: 1px 8px;
      border-radius: 6px;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.45);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-live {
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: 20px;
      border: 1px solid var(--text-white);
      color: var(--text-white);
      letter-spacing: 0.8px;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--neon-cyan);
      box-shadow: 0 0 8px var(--neon-cyan);
    }

    .lock-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-dark);
      color: var(--text-white);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .lock-btn:active {
      border-color: var(--neon-pink);
      color: var(--neon-pink);
    }

    .lock-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .search-box input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-dark);
      color: var(--text-white);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.92rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--neon-white);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 18px 20px 8px;
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border-dark);
      border-radius: 14px;
      padding: 12px;
      text-align: left;
    }

    .kpi-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .kpi-value {
      font-size: 1.25rem;
      font-weight: 800;
    }

    .kpi-value.neon-white { color: var(--neon-white); text-shadow: 0 0 10px rgba(255, 255, 255, 0.35); }
    .kpi-value.neon-pink { color: var(--neon-pink); text-shadow: 0 0 10px rgba(255, 0, 85, 0.35); }
    .kpi-value.neon-cyan { color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0, 240, 255, 0.35); }

    .categories-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 20px;
      scrollbar-width: none;
    }

    .categories-scroll::-webkit-scrollbar { display: none; }

    .cat-chip {
      background: var(--bg-card);
      color: var(--text-white);
      border: 1px solid var(--border-dark);
      padding: 8px 15px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }

    .cat-chip.active {
      background: var(--neon-white);
      color: #000000;
      border-color: var(--neon-white);
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.45);
      font-weight: 800;
    }

    .product-list {
      padding: 10px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border-dark);
      border-radius: 16px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .product-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 60%;
    }

    .product-cat {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .product-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-white);
      line-height: 1.25;
    }

    .product-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .meta-pill {
      background: var(--bg-elevated);
      color: var(--text-white);
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
      border: 1px solid #333333;
    }

    .stock-controls {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stock-status {
      font-size: 0.68rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .status-ok {
      background: rgba(255, 255, 255, 0.1);
      color: var(--neon-white);
      border: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.15);
    }

    .status-low {
      background: rgba(0, 240, 255, 0.12);
      color: var(--neon-cyan);
      border: 1px solid rgba(0, 240, 255, 0.45);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
    }

    .status-out {
      background: rgba(255, 0, 85, 0.15);
      color: var(--neon-pink);
      border: 1px solid rgba(255, 0, 85, 0.5);
      box-shadow: 0 0 8px rgba(255, 0, 85, 0.25);
    }

    .delete-btn {
      background: var(--bg-elevated);
      border: 1px solid var(--border-dark);
      color: var(--text-muted);
      width: 26px;
      height: 26px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .delete-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .delete-btn:active {
      background: rgba(255, 0, 85, 0.15);
      color: var(--neon-pink);
      border-color: var(--neon-pink);
    }

    .stepper {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-elevated);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border-dark);
    }

    .stepper button {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      border: none;
      background: var(--bg-black);
      color: var(--text-white);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .stepper button:active {
      background: var(--neon-white);
      color: #000000;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
    }

    .stock-count {
      min-width: 24px;
      text-align: center;
      font-weight: 800;
      font-size: 0.95rem;
    }

    .fab-btn {
      position: fixed;
      bottom: 22px;
      background: var(--neon-white);
      color: #000000;
      border: none;
      padding: 15px 28px;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(255, 255, 255, 0.5);
      z-index: 20;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 50;
    }

    .modal-overlay.open { display: flex; }

    .modal-sheet {
      width: 100%;
      max-width: 460px;
      background: var(--bg-card);
      border-top: 2px solid var(--neon-white);
      border-radius: 24px 24px 0 0;
      padding: 24px 20px 30px;
    }

    .modal-sheet.danger-sheet {
      border-top: 2px solid var(--neon-pink);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .modal-title { font-size: 1.2rem; font-weight: 800; }

    .close-btn {
      background: var(--bg-elevated);
      color: var(--text-white);
      border: 1px solid var(--border-dark);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
    }

    .form-group { margin-bottom: 14px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 700;
    }

    input, select {
      width: 100%;
      background: var(--bg-black);
      border: 1px solid var(--border-dark);
      color: var(--text-white);
      padding: 12px;
      border-radius: 10px;
      font-size: 0.92rem;
      outline: none;
    }

    .submit-btn {
      width: 100%;
      background: var(--neon-white);
      color: #000000;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 900;
      text-transform: uppercase;
      margin-top: 8px;
      cursor: pointer;
    }

    .delete-text {
      color: var(--text-muted);
      font-size: 0.92rem;
      line-height: 1.45;
      margin-bottom: 20px;
    }

    .delete-text strong { color: var(--text-white); }

    .confirm-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .cancel-action-btn {
      background: var(--bg-elevated);
      color: var(--text-white);
      border: 1px solid var(--border-dark);
      padding: 13px;
      border-radius: 12px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
    }

    .confirm-delete-btn {
      background: var(--neon-pink);
      color: var(--text-white);
      border: none;
      padding: 13px;
      border-radius: 12px;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- PANTALLA DE BLOQUEO CON CONTRASEÑA -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="login-logo">neew<span>shop</span></div>
      <div class="login-subtitle">Acceso Personal Autorizado</div>

      <form onsubmit="verificarAcceso(event)">
        <div class="pass-wrapper">
          <input type="password" id="passInput" placeholder="Contraseña de equipo" required autocomplete="current-password" />
          <button type="button" class="toggle-pass-btn" onclick="togglePasswordVisibility()" id="eyeBtn">Ver</button>
        </div>
        <div class="login-error-msg" id="loginError"></div>
        <button type="submit" class="login-btn">Desbloquear Stock</button>
      </form>
    </div>
  </div>

  <!-- APLICACIÓN PRINCIPAL -->
  <div class="app-container">
    <header>
      <div class="brand-row">
        <div class="brand-title">neew<span>shop</span></div>
        <div class="header-actions">
          <div class="badge-live"><span class="sync-dot"></span> <span id="syncText">En Vivo</span></div>
          <button class="lock-btn" onclick="bloquearApp()" title="Cerrar sesión / Bloquear">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </button>
        </div>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar prenda, color o talla..." oninput="renderProducts()" />
      </div>
    </header>

    <section class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Total Prendas</div>
        <div class="kpi-value neon-white" id="kpiTotal">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Stock Bajo</div>
        <div class="kpi-value neon-pink" id="kpiLow">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Valor Stock</div>
        <div class="kpi-value neon-cyan" id="kpiValue">$0</div>
      </div>
    </section>

    <nav class="categories-scroll">
      <button class="cat-chip active" onclick="setCategory('Todos')">Todos</button>
      <button class="cat-chip" onclick="setCategory('Sudaderas')">Sudaderas</button>
      <button class="cat-chip" onclick="setCategory('Sudaderas con gorro')">Sudaderas con gorro</button>
      <button class="cat-chip" onclick="setCategory('Playeras')">Playeras</button>
      <button class="cat-chip" onclick="setCategory('Shorts')">Shorts</button>
      <button class="cat-chip" onclick="setCategory('Accesorios')">Accesorios</button>
    </nav>

    <main class="product-list" id="productList"></main>
  </div>

  <button class="fab-btn" onclick="toggleModal(true)">+ AGREGAR PRODUCTO</button>

  <!-- Modal Agregar -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <div class="modal-title">Nuevo Producto</div>
        <button class="close-btn" onclick="toggleModal(false)">✕</button>
      </div>
      <form id="productForm" onsubmit="addProduct(event)">
        <div class="form-group">
          <label>Nombre del Producto</label>
          <input type="text" id="pName" placeholder="Ej. Hoodie Oversize Neew" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Categoría</label>
            <select id="pCat" required>
              <option value="Sudaderas">Sudaderas</option>
              <option value="Sudaderas con gorro">Sudaderas con gorro</option>
              <option value="Playeras">Playeras</option>
              <option value="Shorts">Shorts</option>
              <option value="Accesorios">Accesorios</option>
            </select>
          </div>
          <div class="form-group">
            <label>Talla</label>
            <select id="pSize" required>
              <option value="S">S</option>
              <option value="M" selected>M</option>
              <option value="L">L</option>
              <option value="XL">XL</option>
              <option value="Unitalla">Unitalla</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Color</label>
            <input type="text" id="pColor" placeholder="Ej. Negro / Blanco" required />
          </div>
          <div class="form-group">
            <label>Precio ($ MXN)</label>
            <input type="number" id="pPrice" placeholder="550" min="1" required />
          </div>
        </div>
        <div class="form-group">
          <label>Cantidad Inicial en Stock</label>
          <input type="number" id="pStock" placeholder="15" min="0" required />
        </div>
        <button type="submit" class="submit-btn">Guardar en Inventario</button>
      </form>
    </div>
  </div>

  <!-- Modal Eliminar -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal-sheet danger-sheet">
      <div class="modal-header">
        <div class="modal-title">Eliminar Prenda</div>
        <button class="close-btn" onclick="closeDeleteModal()">✕</button>
      </div>
      <p class="delete-text" id="deleteMessage"></p>
      <div class="confirm-actions">
        <button class="cancel-action-btn" onclick="closeDeleteModal()">Cancelar</button>
        <button class="confirm-delete-btn" onclick="confirmDeleteProduct()">Sí, Eliminar</button>
      </div>
    </div>
  </div>

  <!-- SDK de Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    // TU LINK DE FIREBASE YA INTEGRADO:
    const FIREBASE_DATABASE_URL = "https://neewshop-stock-default-rtdb.firebaseio.com/";
    
    // CONTRASEÑA DE EQUIPO (Puedes cambiarla aquí si deseas otra):
    const CLAVE_TIENDA = "neew2026";

    const defaultProducts = [
      { id: 1, name: "Hoodie Oversize Acid Wash", category: "Sudaderas con gorro", size: "L", color: "Negro", price: 680, stock: 14 },
      { id: 2, name: "Crewneck Minimal Neew", category: "Sudaderas", size: "M", color: "Blanco", price: 550, stock: 4 },
      { id: 3, name: "Playera Heavyweight Boxy", category: "Playeras", size: "M", color: "Negro", price: 320, stock: 22 },
      { id: 4, name: "Short Cargo Street", category: "Shorts", size: "L", color: "Gris", price: 420, stock: 0 }
    ];

    let products = [];
    let activeCategory = "Todos";
    let productToDeleteId = null;
    let dbRef = null;
    let firebaseIniciado = false;

    window.addEventListener("DOMContentLoaded", () => {
      const claveGuardada = localStorage.getItem("neewshop_auth_key");
      if (claveGuardada === CLAVE_TIENDA) {
        desbloquearApp(claveGuardada);
      }
    });

    function togglePasswordVisibility() {
      const input = document.getElementById("passInput");
      const btn = document.getElementById("eyeBtn");
      if (input.type === "password") {
        input.type = "text";
        btn.textContent = "Ocultar";
      } else {
        input.type = "password";
        btn.textContent = "Ver";
      }
    }

    function verificarAcceso(e) {
      e.preventDefault();
      const passInput = document.getElementById("passInput");
      const errorMsg = document.getElementById("loginError");
      const ingresada = passInput.value.trim();

      if (ingresada === CLAVE_TIENDA) {
        localStorage.setItem("neewshop_auth_key", ingresada);
        errorMsg.textContent = "";
        passInput.value = "";
        desbloquearApp(ingresada);
      } else {
        errorMsg.textContent = "Contraseña incorrecta. Acceso denegado.";
        passInput.classList.remove("input-error");
        void passInput.offsetWidth;
        passInput.classList.add("input-error");
      }
    }

    function desbloquearApp(claveActiva) {
      document.getElementById("loginScreen").classList.add("hidden");
      iniciarConexionDatos(claveActiva);
    }

    function bloquearApp() {
      localStorage.removeItem("neewshop_auth_key");
      document.getElementById("loginScreen").classList.remove("hidden");
    }

    function iniciarConexionDatos(claveActiva) {
      if (FIREBASE_DATABASE_URL.startsWith("https://")) {
        if (!firebaseIniciado) {
          firebase.initializeApp({ databaseURL: FIREBASE_DATABASE_URL });
          firebaseIniciado = true;
        }
        dbRef = firebase.database().ref("neewshop_vault/" + claveActiva + "/stock");

        dbRef.on("value", (snapshot) => {
          const data = snapshot.val();
          if (data) {
            products = Array.isArray(data) ? data.filter(Boolean) : Object.values(data);
          } else {
            products = defaultProducts;
            dbRef.set(products);
          }
          renderProducts();
        });
      } else {
        document.getElementById("syncText").textContent = "Modo Local";
        products = JSON.parse(localStorage.getItem("neewshop_stock")) || defaultProducts;
        renderProducts();
      }
    }

    function saveToDB() {
      if (dbRef) {
        dbRef.set(products);
      } else {
        localStorage.setItem("neewshop_stock", JSON.stringify(products));
        renderProducts();
      }
    }

    function setCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll(".cat-chip").forEach(btn => {
        btn.classList.toggle("active", btn.textContent === cat);
      });
      renderProducts();
    }

    function updateStock(id, delta) {
      const item = products.find(p => p.id === id);
      if (item) {
        item.stock = Math.max(0, item.stock + delta);
        saveToDB();
      }
    }

    function addProduct(e) {
      e.preventDefault();
      const newProduct = {
        id: Date.now(),
        name: document.getElementById("pName").value.trim(),
        category: document.getElementById("pCat").value,
        size: document.getElementById("pSize").value,
        color: document.getElementById("pColor").value.trim(),
        price: parseFloat(document.getElementById("pPrice").value),
        stock: parseInt(document.getElementById("pStock").value, 10)
      };
      products.unshift(newProduct);
      saveToDB();
      document.getElementById("productForm").reset();
      toggleModal(false);
    }

    function askDeleteProduct(id) {
      const item = products.find(p => p.id === id);
      if (!item) return;
      productToDeleteId = id;
      document.getElementById("deleteMessage").innerHTML = 
        `¿Seguro que deseas eliminar <strong>${item.name}</strong> (Talla ${item.size} • ${item.color}) del stock?`;
      document.getElementById("deleteModal").classList.add("open");
    }

    function closeDeleteModal() {
      productToDeleteId = null;
      document.getElementById("deleteModal").classList.remove("open");
    }

    function confirmDeleteProduct() {
      if (productToDeleteId !== null) {
        products = products.filter(p => p.id !== productToDeleteId);
        saveToDB();
        closeDeleteModal();
      }
    }

    function toggleModal(show) {
      document.getElementById("addModal").classList.toggle("open", show);
    }

    function renderProducts() {
      const list = document.getElementById("productList");
      const query = document.getElementById("searchInput").value.toLowerCase();

      const totalItems = products.reduce((acc, p) => acc + p.stock, 0);
      const lowStockItems = products.filter(p => p.stock <= 5).length;
      const totalValue = products.reduce((acc, p) => acc + (p.stock * p.price), 0);

      document.getElementById("kpiTotal").textContent = totalItems;
      document.getElementById("kpiLow").textContent = lowStockItems;
      document.getElementById("kpiValue").textContent = "$" + totalValue.toLocaleString("es-MX");

      const filtered = products.filter(p => {
        const matchesCat = activeCategory === "Todos" || p.category === activeCategory;
        const matchesSearch = p.name.toLowerCase().includes(query) ||
                              p.color.toLowerCase().includes(query) ||
                              p.size.toLowerCase().includes(query);
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty-state">No se encontraron prendas en esta sección.</div>`;
        return;
      }

      list.innerHTML = filtered.map(p => {
        let statusClass = "status-ok";
        let statusText = "En Stock";
        if (p.stock === 0) {
          statusClass = "status-out";
          statusText = "Agotado";
        } else if (p.stock <= 5) {
          statusClass = "status-low";
          statusText = "Poco Stock";
        }

        return `
          <div class="product-card">
            <div class="product-info">
              <span class="product-cat">${p.category}</span>
              <div class="product-name">${p.name}</div>
              <div class="product-meta">
                <span class="meta-pill">Talla ${p.size}</span>
                <span>${p.color}</span>
                <span>• $${p.price}</span>
              </div>
            </div>
            <div class="stock-controls">
              <div class="status-row">
                <span class="stock-status ${statusClass}">${statusText}</span>
                <button class="delete-btn" onclick="askDeleteProduct(${p.id})" title="Eliminar">
                  <svg viewBox="0 0 24 24">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                  </svg>
                </button>
              </div>
              <div class="stepper">
                <button onclick="updateStock(${p.id}, -1)">−</button>
                <span class="stock-count">${p.stock}</span>
                <button onclick="updateStock(${p.id}, 1)">+</button>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }
  </script>
</body>
</html>
